<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafafa">
<title>한글 조립 놀이 v8</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#111;--muted:#777;--line:#e7e7e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:440px;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0}
select{font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 10px}
.progress{margin:7px 0 5px;height:5px;background:#e8e8e8;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:#222;width:0;transition:width .2s}
.meta{height:22px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.stage{flex:1;min-height:0;padding:7px 0;display:flex}
.card{position:relative;width:100%;height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.035);user-select:none}
.lesson{position:absolute;inset:0}

/* One learning target per screen: consonant -> vowel -> composed syllable. */
.jamo{position:absolute;inset:6%;display:none;align-items:center;justify-content:center;
  font-weight:850;line-height:1;letter-spacing:0;text-align:center;transform:none}
.consonant{font-size:min(102vw,448px);translate:-1.5% 0}
.vowel{font-size:min(102vw,448px);translate:-1.5% 0}
.plus{display:none}
.caption{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:#999}
.answer{display:none;position:absolute;inset:6%;align-items:center;justify-content:center;
  font-size:min(102vw,448px);font-weight:850;line-height:1;letter-spacing:0;text-align:center;transform:none}
.answer-note{display:none;position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#888;font-size:13px}

/* phase 0 */
.lesson:not(.focus-vowel):not(.revealed) .consonant{display:flex}
/* phase 1 */
.lesson.focus-vowel:not(.revealed) .vowel{display:flex}
/* phase 2 */
.lesson.revealed .answer{display:flex}
.lesson.revealed .answer-note{display:block}
.lesson.revealed .caption{display:none}

.memorize{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.memorize .big{font-size:min(102vw,448px);font-weight:850;line-height:1}
.memorize .name{position:absolute;bottom:14px;left:0;right:0;font-size:18px;font-weight:750;color:#555}
.quiz{display:none;position:absolute;inset:0;flex-direction:column;padding:18px}
.quiz-prompt{height:23%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800}
.quiz-choices{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:stretch}
.quiz-choice{background:#fff;border:2px solid #e2e2e2;border-radius:22px;font-size:min(25vw,105px);font-weight:850}
.quiz-choice.correct{border-color:#111;background:#f0f0f0}
.quiz-choice.wrong{opacity:.28}
.done{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}
.done h2{font-size:36px;margin:0 0 10px}.done p{color:#777;line-height:1.55}
.controls{height:57px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls.three{grid-template-columns:.75fr 1fr 1fr}
button{font:inherit;border:0;border-radius:16px;font-size:16px;font-weight:750}
.secondary{background:#e9e9e9;color:#111}.primary{background:#151515;color:#fff}
.tools{height:38px;display:flex;justify-content:center;align-items:end;gap:8px}
.tools button{background:transparent;border:1px solid var(--line);padding:7px 12px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<main class="app">
<header><h1>한글 조립 놀이</h1>
<select id="week" aria-label="주차 선택"><option value="1">1주차</option><option value="2">2주차</option><option value="3">3주차</option><option value="4">4주차</option></select></header>
<div class="progress"><div id="bar"></div></div>
<div class="meta"><span id="label">오늘 1 / 10</span><span id="mode">자음부터 보기</span></div>
<section class="stage">
<div class="card" id="card">
  <div class="lesson" id="lesson">
    <div class="jamo consonant" id="c">ㄱ</div>
    <div class="plus">+</div>
    <div class="jamo vowel" id="v">ㅏ</div>
    <div class="caption" id="caption">자음 소리를 내보세요</div>
    <div class="answer" id="answer">가</div>
    <div class="answer-note" id="answerNote">ㄱ + ㅏ</div>
  </div>
  <div class="memorize" id="memorize">
    <div class="big" id="memorizeChar">ㄱ</div>
    <div class="name" id="memorizeName">기역</div>
  </div>
  <div class="quiz" id="quiz">
    <div class="quiz-prompt" id="quizPrompt">기역을 찾아보세요</div>
    <div class="quiz-choices" id="quizChoices"></div>
  </div>
  <div class="done" id="done"><h2>오늘 끝!</h2><p>10개를 모두 해봤어요.<br>자음과 모음을 하나씩 보고 합쳐봤어요.</p></div>
</div>
</section>
<div class="controls three"><button class="secondary" id="back">이전</button><button class="secondary" id="step">다음 보기</button><button class="primary" id="next">다음 글자</button></div>
<div class="tools"><button id="restart">처음부터</button><button id="shuffle">새 문제</button></div>
</main>
<script>
const sets={
1:{c:["ㄱ","ㄴ","ㄷ"],v:["ㅏ","ㅗ","ㅜ"]},
2:{c:["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ"],v:["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ"]},
3:{c:["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅎ"],v:["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ"]},
4:{c:["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅎ"],v:["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ"]}
};
const names={"ㄱ":"기역","ㄴ":"니은","ㄷ":"디귿","ㄹ":"리을","ㅁ":"미음","ㅂ":"비읍","ㅅ":"시옷","ㅇ":"이응","ㅈ":"지읒","ㅎ":"히읗",
"ㅏ":"아","ㅓ":"어","ㅗ":"오","ㅜ":"우","ㅡ":"으","ㅣ":"이"};
const C=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const V=["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const $=id=>document.getElementById(id);
function syllable(c,v){let ci=C.indexOf(c),vi=V.indexOf(v);return String.fromCharCode(0xAC00+(ci*21+vi)*28)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let stage="learn", learnItems=[], learnIdx=0, quizItems=[], quizIdx=0, qs=[], idx=0, phase=0, locked=false;

function startDay(){
 const set=sets[$("week").value];
 learnItems=[...set.c,...set.v];
 learnIdx=0; quizItems=shuffle([...learnItems]); quizIdx=0; locked=false;
 const pool=[]; set.c.forEach(c=>set.v.forEach(v=>pool.push({c,v,a:syllable(c,v)})));
 qs=shuffle(pool).slice(0,10); idx=0; phase=0; stage="learn"; render();
}
function showOnly(id){
 ["lesson","memorize","quiz","done"].forEach(x=>$(x).style.display=x===id?(x==="quiz"?"flex":x==="lesson"?"block":"flex"):"none");
}
function render(){
 $("back").disabled=false; $("step").disabled=false; $("next").disabled=false;
 if(stage==="learn"){
   showOnly("memorize");
   const ch=learnItems[learnIdx];
   $("memorizeChar").textContent=ch; $("memorizeName").textContent=names[ch]||ch;
   $("label").textContent=`익히기 ${learnIdx+1} / ${learnItems.length}`;
   $("mode").textContent=learnIdx < sets[$("week").value].c.length ? "오늘의 자음" : "오늘의 모음";
   $("bar").style.width=((learnIdx+1)/learnItems.length*30)+"%";
   $("step").textContent="다시 보기"; $("next").textContent=learnIdx===learnItems.length-1?"고르기 시작":"다음";
   $("back").disabled=learnIdx===0;
   return;
 }
 if(stage==="quiz"){
   showOnly("quiz"); locked=false;
   const target=quizItems[quizIdx], set=sets[$("week").value], pool=set.c.includes(target)?set.c:set.v;
   $("quizPrompt").textContent=`${names[target]||target}을 찾아보세요`;
   $("quizChoices").innerHTML="";
   shuffle(pool).forEach(ch=>{
     const b=document.createElement("button"); b.className="quiz-choice"; b.textContent=ch;
     b.onclick=()=>choose(ch,target,b); $("quizChoices").appendChild(b);
   });
   $("label").textContent=`골라보기 ${quizIdx+1} / ${quizItems.length}`;
   $("mode").textContent="오늘 배운 글자";
   $("bar").style.width=(30+(quizIdx/quizItems.length)*30)+"%";
   $("step").textContent="다시 익히기"; $("next").textContent="건너뛰기";
   $("back").disabled=true;
   return;
 }
 if(stage==="compose"){
   const finished=idx>=qs.length;
   if(finished){stage="done";render();return}
   showOnly("lesson");
   const q=qs[idx]; $("c").textContent=q.c;$("v").textContent=q.v;$("answer").textContent=q.a;$("answerNote").textContent=`${q.c} + ${q.v}`;
   $("lesson").classList.toggle("focus-vowel",phase===1); $("lesson").classList.toggle("revealed",phase===2);
   $("label").textContent=`조립 ${idx+1} / ${qs.length}`; $("bar").style.width=(60+(idx/qs.length)*40)+"%";
   if(phase===0){$("mode").textContent="자음부터 보기";$("caption").textContent="자음 소리를 내보세요";$("step").textContent="모음 보기"}
   if(phase===1){$("mode").textContent="이번엔 모음";$("caption").textContent="모음 소리를 내보세요";$("step").textContent="합치기"}
   if(phase===2){$("mode").textContent="합친 글자";$("step").textContent="다시 보기"}
   $("next").textContent="다음 글자"; $("back").disabled=(idx===0&&phase===0); return;
 }
 showOnly("done"); $("label").textContent="오늘 완료"; $("mode").textContent="잘했어요"; $("bar").style.width="100%";
 $("step").disabled=true;$("next").disabled=true;$("back").disabled=false;
}
function choose(ch,target,btn){
 if(locked)return;
 if(ch===target){
   locked=true; btn.classList.add("correct");
   setTimeout(()=>{quizIdx++; if(quizIdx>=quizItems.length){stage="compose";idx=0;phase=0}else stage="quiz"; render()},450);
 }else{
   btn.classList.add("wrong");
 }
}
function next(){
 if(stage==="learn"){if(learnIdx<learnItems.length-1)learnIdx++;else{stage="quiz";quizIdx=0}render();return}
 if(stage==="quiz"){quizIdx++;if(quizIdx>=quizItems.length){stage="compose";idx=0;phase=0}render();return}
 if(stage==="compose"){idx++;phase=0;render()}
}
function step(){
 if(stage==="learn"){render();return}
 if(stage==="quiz"){stage="learn";learnIdx=0;render();return}
 if(stage==="compose"){if(phase<2)phase++;else phase=0;render()}
}
function back(){
 if(stage==="learn"){if(learnIdx>0)learnIdx--;render();return}
 if(stage==="quiz"){stage="learn";learnIdx=learnItems.length-1;render();return}
 if(stage==="compose"){if(phase>0)phase--;else if(idx>0){idx--;phase=2}render();return}
 if(stage==="done"){stage="compose";idx=qs.length-1;phase=2;render()}
}
$("card").addEventListener("click",e=>{if(stage==="learn")next();else if(stage==="compose"){if(phase<2){phase++;render()}else next()}});
$("back").addEventListener("click",back);$("step").addEventListener("click",step);$("next").addEventListener("click",next);
$("restart").addEventListener("click",startDay);$("shuffle").addEventListener("click",startDay);
$("week").addEventListener("change",startDay);startDay();
</script>
</body></html>
